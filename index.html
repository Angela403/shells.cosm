<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логотип SHELA</title>
    
    <!-- Подключаем новые, более элегантные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Great+Vibes&family=Montserrat:wght@300&display=swap" rel="stylesheet">
    
    <!-- Библиотека для сохранения картинки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Montserrat', sans-serif;
        }

        /* Квадрат для скачивания */
        #logo-to-save {
            width: 600px;
            height: 600px;
            background-color: #F2D4D8; /* Пыльно-розовый фон */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            transition: transform 0.2s;
            position: relative;
        }

        #logo-to-save:hover {
            transform: scale(1.02);
        }

        /* Основное слово (Антиква) */
        .logo-main {
            font-family: 'Cormorant Garamond', serif;
            font-size: 6rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            color: #5E1B28; /* Винный */
            text-transform: uppercase;
            line-height: 1;
            margin-left: 0.18em; /* Выравнивание для letter-spacing */
        }

        /* Рукописное слово (Каллиграфия) */
        .logo-sub {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: #5E1B28;
            transform: rotate(-4deg); /* Легкий наклон */
            line-height: 1;
            margin-top: -15px; /* Приближаем к основному слову */
            z-index: 2;
        }

        /* Минималистичный год */
        .tagline {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.6em;
            color: #5E1B28;
            margin-top: 45px;
            text-transform: uppercase;
            font-weight: 300;
            margin-left: 0.6em; /* Выравнивание */
        }

        /* Текст-подсказка */
        .hint {
            margin-top: 30px;
            color: #555;
            font-size: 1rem;
            text-align: center;
        }

        /* Адаптив для телефонов */
        @media (max-width: 650px) {
            #logo-to-save {
                width: 90vw;
                height: 90vw;
            }
            .logo-main { font-size: 4rem; }
            .logo-sub { font-size: 3.5rem; margin-top: -10px; }
            .tagline { font-size: 0.7rem; margin-top: 30px; }
        }
    </style>
</head>
<body>

    <!-- Блок логотипа -->
    <div id="logo-to-save" title="Нажмите, чтобы сохранить в галерею">
        <div class="logo-main">SHELA</div>
        <div class="logo-sub">Shella</div>
        <div class="tagline">2026</div>
    </div>

    <div class="hint">👆 Нажмите на логотип, чтобы сохранить его в галерею</div>

    <script>
        document.getElementById('logo-to-save').addEventListener('click', function() {
            const logoElement = this;
            
            // Показываем, что идет загрузка
            logoElement.style.cursor = 'wait';

            // Делаем снимок с 4х увеличением (максимальное качество)
            html2canvas(logoElement, {
                scale: 4, 
                backgroundColor: null,
                useCORS: true 
            }).then(canvas => {
                const image = canvas.toDataURL("image/png", 1.0);
                
                const link = document.createElement('a');
                link.download = 'shela-logo-2026.png';
                link.href = image;
                link.click();
                
                logoElement.style.cursor = 'pointer';
            }).catch(err => {
                console.error("Ошибка:", err);
                alert("Не удалось сохранить автоматически. Сделайте скриншот.");
                logoElement.style.cursor = 'pointer';
            });
        });
    </script>
</body>
</html>
