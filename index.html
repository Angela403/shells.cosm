<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shella Cosmetics - Fun & Glam</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { text-align: center; color: #333; font-weight: 500; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; margin-bottom: 40px; font-size: 0.9rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .logo-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            background-color: #FFCAD4; /* Твой розовый фон */
            color: #5E1B28; /* Твой винный текст */
        }

        .logo-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .logo-box:hover::after {
            content: "Скачать";
            position: absolute;
            bottom: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        /* Контейнер для текста */
        .text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
        }

        .shella {
            font-family: 'Italiana', serif;
            font-style: italic;
            font-size: 6rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 0.8;
        }

        .cosmetics {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: lowercase;
            position: relative;
            top: -5px; 
            left: 45px; /* Сдвиг вправо */
        }

        /* Векторная графика (SVG) */
        .icon {
            width: 60px;
            height: 60px;
            margin-bottom: 20px;
            fill: #5E1B28;
        }

        .label {
            text-align: center;
            margin-top: 15px;
            color: #444;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .label span { font-size: 0.75rem; color: #777; }

    </style>
</head>
<body>

    <h2>Добавляем изюминку 😉</h2>
    <p class="sub">Выбери вариант с графикой. Нажми на квадрат для сохранения.</p>

    <div class="grid">

        <!-- Вариант 1: Коктейль Мартини -->
        <div>
            <div class="logo-box" id="box1">
                <!-- SVG Мартини с вишней -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M6 4h12l-6 8v6h-4v-6L6 4z" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 20h16" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M10 4l4 5" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                    <circle cx="16" cy="11" r="2" fill="#5E1B28"/>
                    <path d="M16 9c0-2-2-2-2-4" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
                
                <div class="text-container">
                    <div class="shella">Shella</div>
                    <div class="cosmetics">cosmetics</div>
                </div>
            </div>
            <div class="label">Вариант 1<br><span>Cherry Martini</span></div>
        </div>

        <!-- Вариант 2: Лебедь -->
        <div>
            <div class="logo-box" id="box2">
                <!-- SVG Лебедь (минимализм) -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M4 20c4 0 8-2 11-5.5s3-7.5 3-7.5c-1 0-2 1-2 2.5 0 1.5-1 2.5-2 3-1.5-.5-2-2.5-1-4 1.5-2 3.5-2 5-1 1.5 1 2 3.5 1 5.5-1.5 3-5 7-9 8.5H4z" fill="none" stroke="#5E1B28" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M16 9c-1 1-2.5 1.5-4 1.5" fill="none" stroke="#5E1B28" stroke-width="1.2" stroke-linecap="round"/>
                    <circle cx="15" cy="7" r="0.5" fill="#5E1B28"/>
                </svg>
                
                <div class="text-container">
                    <div class="shella">Shella</div>
                    <div class="cosmetics">cosmetics</div>
                </div>
            </div>
            <div class="label">Вариант 2<br><span>Elegant Swan</span></div>
        </div>

        <!-- Вариант 3: Бокал Шампанского и искры -->
        <div>
            <div class="logo-box" id="box3">
                <!-- SVG Шампанское -->
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M8 2v7c0 2.5 2 4.5 4 4.5s4-2 4-4.5V2" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 13.5V20" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 20h8" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M8 8h8" fill="none" stroke="#5E1B28" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M18 3l1-1M20 6l1-1M16 1l1 1" fill="none" stroke="#5E1B28" stroke-width="1.2" stroke-linecap="round"/>
                </svg>
                
                <div class="text-container">
                    <div class="shella">Shella</div>
                    <div class="cosmetics">cosmetics</div>
                </div>
            </div>
            <div class="label">Вариант 3<br><span>Champagne & Sparkles</span></div>
        </div>

    </div>

    <script>
        function downloadLogo(elementId, fileName) {
            const logoElement = document.getElementById(elementId);
            
            // Ждем загрузки шрифтов
            document.fonts.ready.then(() => {
                html2canvas(logoElement, {
                    scale: 4, 
                    backgroundColor: null,
                    useCORS: true 
                }).then(canvas => {
                    const image = canvas.toDataURL("image/png", 1.0);
                    
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
                    if (isMobile) {
                        const win = window.open();
                        win.document.write(`
                            <html>
                            <head><title>Сохраните логотип</title><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
                            <body style="margin:0; background:#e5e5e5; display:flex; flex-direction:column; align-items:center;">
                                <img src="${image}" style="width: 100%; max-width: 600px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); margin-top: 20px;" />
                                <h2 style="font-family:sans-serif; color:#333; text-align:center; margin-top:20px; padding: 0 20px;">
                                    Зажмите картинку пальцем<br>и выберите «Сохранить в галерею»
                                </h2>
                            </body>
                            </html>
                        `);
                    } else {
                        const link = document.createElement('a');
                        link.download = fileName;
                        link.href = image;
                        link.click();
                    }
                }).catch(err => {
                    console.error("Ошибка:", err);
                    alert("Не удалось сохранить. Сделайте скриншот.");
                });
            });
        }

        document.getElementById('box1').addEventListener('click', () => downloadLogo('box1', 'shella-martini.png'));
        document.getElementById('box2').addEventListener('click', () => downloadLogo('box2', 'shella-swan.png'));
        document.getElementById('box3').addEventListener('click', () => downloadLogo('box3', 'shella-champagne.png'));
    </script>
</body>
</html>
