<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финальный логотип SHELLA COSMETICS</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        #logo-to-save {
            width: 600px;
            height: 600px;
            background-color: #FFCAD4;
            color: #5E1B28;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
        }

        #logo-to-save:active {
            transform: scale(0.98); /* Эффект нажатия */
        }

        .shella {
            font-family: 'Italiana', serif;
            font-style: italic;
            font-size: 7rem;
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1;
        }

        .cosmetics {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: lowercase;
            position: relative;
            top: -15px;
            left: 50px;
        }

        .hint {
            margin-top: 30px;
            color: #555;
            font-size: 1rem;
            text-align: center;
            max-width: 80%;
            line-height: 1.5;
        }

        @media (max-width: 650px) {
            #logo-to-save {
                width: 90vw;
                height: 90vw;
            }
            .shella { font-size: 5rem; }
            .cosmetics { font-size: 0.7rem; top: -10px; left: 35px; }
        }
    </style>
</head>
<body>

    <div id="logo-to-save" title="Нажмите для сохранения">
        <div class="shella">Shella</div>
        <div class="cosmetics">cosmetics</div>
    </div>

    <div class="hint" id="hint-text">👆 Нажмите на логотип, чтобы сохранить</div>

    <script>
        document.getElementById('logo-to-save').addEventListener('click', function() {
            const logoElement = this;
            const hintText = document.getElementById('hint-text');
            
            hintText.innerText = "Готовим картинку...";
            hintText.style.color = "#5E1B28";

            // Ждем, пока все шрифты загрузятся, чтобы картинка была идеальной
            document.fonts.ready.then(() => {
                html2canvas(logoElement, {
                    scale: 4, // Высокое качество
                    backgroundColor: null,
                    useCORS: true 
                }).then(canvas => {
                    const image = canvas.toDataURL("image/png", 1.0);
                    
                    // Проверяем, на телефоне ли пользователь
                    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

                    if (isMobile) {
                        // Для телефонов: открываем картинку в новом окне
                        const win = window.open();
                        win.document.write(`
                            <html>
                            <head><title>Сохраните логотип</title><meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
                            <body style="margin:0; background:#e5e5e5; display:flex; flex-direction:column; align-items:center;">
                                <img src="${image}" style="width: 100%; max-width: 600px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); margin-top: 20px;" />
                                <h2 style="font-family:sans-serif; color:#333; text-align:center; margin-top:20px; padding: 0 20px;">
                                    Зажмите картинку пальцем<br>и выберите «Сохранить в галерею»
                                </h2>
                            </body>
                            </html>
                        `);
                        hintText.innerText = "👆 Нажмите на логотип, чтобы сохранить";
                        hintText.style.color = "#555";
                    } else {
                        // Для компьютеров: обычное скачивание
                        const link = document.createElement('a');
                        link.download = 'shella-cosmetics-final.png';
                        link.href = image;
                        link.click();
                        
                        hintText.innerText = "✅ Успешно сохранено!";
                        setTimeout(() => {
                            hintText.innerText = "👆 Нажмите на логотип, чтобы сохранить";
                        }, 3000);
                    }

                }).catch(err => {
                    console.error("Ошибка:", err);
                    hintText.innerText = "Ошибка при создании. Попробуйте еще раз.";
                });
            });
        });
    </script>
</body>
</html>
