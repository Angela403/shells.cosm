<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финальный логотип SHELLA COSMETICS</title>
    
    <!-- Шрифты: Italiana (для Shella) и Montserrat (Gilroy для cosmetics) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Montserrat:wght@500&display=swap" rel="stylesheet">
    
    <!-- Библиотека для скачивания -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Квадрат логотипа */
        #logo-to-save {
            width: 600px;
            height: 600px;
            background-color: #FFCAD4; /* Яркий розовый */
            color: #5E1B28; /* Глубокий винный */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
        }

        #logo-to-save:hover {
            transform: scale(1.02);
        }

        /* Слово Shella */
        .shella {
            font-family: 'Italiana', serif;
            font-style: italic; /* Наклон для сходства с капчей */
            font-size: 7rem; /* Сделал чуть крупнее для баланса */
            font-weight: 400;
            letter-spacing: 0.05em;
            line-height: 1;
        }

        /* Слово cosmetics */
        .cosmetics {
            font-family: 'Montserrat', sans-serif; /* Аналог Gilroy */
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: lowercase;
            
            /* Вот здесь твои правки: поднимаем и сдвигаем вправо */
            position: relative;
            top: -15px; /* Подняли выше */
            left: 50px; /* Сдвинули вправо */
        }

        /* Подсказка */
        .hint {
            margin-top: 30px;
            color: #555;
            font-size: 1rem;
            text-align: center;
        }

        /* Адаптив для телефонов */
        @media (max-width: 650px) {
            #logo-to-save {
                width: 90vw;
                height: 90vw;
            }
            .shella { font-size: 5rem; }
            .cosmetics { font-size: 0.7rem; top: -10px; left: 35px; }
        }
    </style>
</head>
<body>

    <!-- Блок логотипа -->
    <div id="logo-to-save" title="Нажмите, чтобы сохранить">
        <div class="shella">Shella</div>
        <div class="cosmetics">cosmetics</div>
    </div>

    <div class="hint">👆 Нажмите на логотип, чтобы скачать его в высоком качестве</div>

    <script>
        document.getElementById('logo-to-save').addEventListener('click', function() {
            const logoElement = this;
            logoElement.style.cursor = 'wait';

            html2canvas(logoElement, {
                scale: 4, // 2400x2400 пикселей
                backgroundColor: null,
                useCORS: true 
            }).then(canvas => {
                const image = canvas.toDataURL("image/png", 1.0);
                const link = document.createElement('a');
                link.download = 'shella-cosmetics-final.png';
                link.href = image;
                link.click();
                logoElement.style.cursor = 'pointer';
            }).catch(err => {
                console.error("Ошибка:", err);
                alert("Не удалось сохранить. Сделайте скриншот.");
                logoElement.style.cursor = 'pointer';
            });
        });
    </script>
</body>
</html>
