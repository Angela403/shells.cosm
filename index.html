<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Логотип SHELA COSMETICS</title>
    
    <!-- Шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    
    <!-- Библиотека для сохранения картинки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Контейнер для скачивания (квадрат как на референсе) */
        #logo-to-save {
            width: 600px;
            height: 600px;
            background-color: #F2D4D8; /* Пыльно-розовый */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
        }

        #logo-to-save:hover {
            transform: scale(1.02);
        }

        /* Логотип */
        .logo-main {
            font-family: 'Playfair Display', serif;
            font-size: 6rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: #5E1B28; /* Винный */
            text-transform: uppercase;
            line-height: 0.8;
            margin-left: 0.15em; /* Компенсация letter-spacing для центровки */
        }

        .logo-sub-wrapper {
            display: flex;
            align-items: center;
            margin-top: -20px;
            position: relative;
            z-index: 2;
        }

        .logo-sub {
            font-family: 'Alex Brush', cursive;
            font-size: 4.5rem;
            color: #5E1B28;
            transform: rotate(-6deg); /* Наклон как на референсе */
            line-height: 1;
        }

        .logo-star {
            width: 35px;
            height: 35px;
            fill: #5E1B28;
            margin-left: 15px;
            margin-top: 10px;
        }

        .tagline {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            letter-spacing: 0.4em;
            color: #5E1B28;
            margin-top: 40px;
            text-transform: uppercase;
            font-weight: 500;
        }

        /* Текст-подсказка */
        .hint {
            margin-top: 30px;
            color: #555;
            font-size: 1.1rem;
            text-align: center;
        }

        /* Адаптив для телефонов */
        @media (max-width: 650px) {
            #logo-to-save {
                width: 90vw;
                height: 90vw;
            }
            .logo-main { font-size: 4rem; }
            .logo-sub { font-size: 3rem; }
            .logo-star { width: 25px; height: 25px; }
            .tagline { font-size: 0.8rem; margin-top: 30px; }
        }
    </style>
</head>
<body>

    <!-- Блок, который будет сохраняться -->
    <div id="logo-to-save" title="Нажмите, чтобы сохранить в галерею">
        <div class="logo-main">SHELA</div>
        <div class="logo-sub-wrapper">
            <div class="logo-sub">Cosmetics</div>
            <!-- Векторная звезда -->
            <svg class="logo-star" viewBox="0 0 24 24">
                <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
        </div>
        <div class="tagline">SINCE 2024</div>
    </div>

    <div class="hint">👆 Нажмите на логотип, чтобы скачать его в высоком качестве</div>

    <script>
        document.getElementById('logo-to-save').addEventListener('click', function() {
            const logoElement = this;
            
            // Меняем курсор, чтобы показать загрузку
            logoElement.style.cursor = 'wait';

            // Делаем скриншот блока с увеличением в 4 раза (для очень высокого качества)
            html2canvas(logoElement, {
                scale: 4, 
                backgroundColor: null, // Сохраняем фон
                useCORS: true 
            }).then(canvas => {
                // Конвертируем в картинку
                const image = canvas.toDataURL("image/png", 1.0);
                
                // Создаем невидимую ссылку для скачивания
                const link = document.createElement('a');
                link.download = 'shela-cosmetics-logo.png';
                link.href = image;
                link.click();
                
                // Возвращаем курсор
                logoElement.style.cursor = 'pointer';
            }).catch(err => {
                console.error("Ошибка при сохранении:", err);
                alert("Не удалось сохранить. Попробуйте сделать скриншот экрана.");
                logoElement.style.cursor = 'pointer';
            });
        });
    </script>
</body>
</html>
