<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Превью шрифта Lira для SHELLA</title>
    
    <!-- Подключаем Gilroy (Montserrat) и курсивные шрифты -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Montserrat (Gilroy) + Great Vibes (перьевой) + Italiana (контрастный курсив) -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Italiana&family=Montserrat:wght@300;500&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { text-align: center; color: #333; font-weight: 500; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; margin-bottom: 40px; font-size: 0.9rem; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 950px;
            width: 100%;
        }

        .logo-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            background-color: #FFCAD4; /* Яркий розовый фон */
            color: #5E1B28; /* Глубокий винный текст */
        }

        .logo-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .logo-box:hover::after {
            content: "Скачать";
            position: absolute;
            bottom: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
        }

        /* Общая база для Shella (курсив) */
        .shella {
            font-size: 6.5rem;
            line-height: 0.8;
            margin-bottom: 15px;
        }

        /* Общая база для cosmetics (Gilroy) */
        .cosmetics {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.5em;
            text-transform: lowercase;
            margin-left: 0.5em;
        }

        /* --- ВАРИАНТ 1: Каллиграфический (перьевой) --- */
        .v1 .shella {
            font-family: 'Great Vibes', cursive;
        }

        /* --- ВАРИАНТ 2: Контрастный курсив (ближе к капче) --- */
        /* Используем Italiana как элегантную альтернативу Cursive Lirav 11 */
        .v2 .shella {
            font-family: 'Italiana', serif;
            font-style: italic; /* Добавляем наклон для сходства с капчей */
            font-weight: 400;
            letter-spacing: 0.05em;
        }

        /* --- ВАРИАНТ 3: Лёгкий рукописный (Cursive Lirav Style) --- */
        /* Используем курсивный Gilroy (Montserrat Italic) для чистоты, если перьевой не подходит */
        .v3 .shella {
            font-family: 'Montserrat', sans-serif;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 0.02em;
        }
        
        .label {
            text-align: center;
            margin-top: 15px;
            color: #444;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .label span { font-size: 0.75rem; color: #777; }
    </style>
</head>
<body>

    <h2>Варианты шрифта для слова Shella</h2>
    <p class="sub">Нажми на квадрат, чтобы сохранить в PNG</p>

    <div class="grid">

        <!-- Вариант 1: Перьевой курсив (Great Vibes) -->
        <div>
            <div class="logo-box v1" id="box1">
                <div class="shella">Shella</div>
                <div class="cosmetics">cosmetics</div>
            </div>
            <div class="label">Вариант 1<br><span>Перьевой курсив (Great Vibes)</span></div>
        </div>

        <!-- Вариант 2: Контрастный курсив (Italiana) -->
        <div>
            <div class="logo-box v2" id="box2">
                <div class="shella">Shella</div>
                <div class="cosmetics">cosmetics</div>
            </div>
            <div class="label">Вариант 2<br><span>Контрастный курсив (похож на Cursive Lirav)</span></div>
        </div>

        <!-- Вариант 3: Лёгкий рукописный (Montserrat Italic) -->
        <div>
            <div class="logo-box v3" id="box3">
                <div class="shella">Shella</div>
                <div class="cosmetics">cosmetics</div>
            </div>
            <div class="label">Вариант 3<br><span>Лёгкий рукописный (чистый курсив)</span></div>
        </div>

    </div>

    <script>
        function downloadLogo(elementId, fileName) {
            const logoElement = document.getElementById(elementId);
            
            html2canvas(logoElement, {
                scale: 4,
                backgroundColor: null,
                useCORS: true 
            }).then(canvas => {
                const image = canvas.toDataURL("image/png", 1.0);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = image;
                link.click();
            }).catch(err => {
                console.error("Ошибка:", err);
                alert("Не удалось сохранить. Сделайте скриншот.");
            });
        }

        document.getElementById('box1').addEventListener('click', () => downloadLogo('box1', 'shella-v1.png'));
        document.getElementById('box2').addEventListener('click', () => downloadLogo('box2', 'shella-v2.png'));
        document.getElementById('box3').addEventListener('click', () => downloadLogo('box3', 'shella-v3.png'));
    </script>
</body>
</html>
