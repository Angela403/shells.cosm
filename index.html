<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финальный логотип SHELA</title>
    
    <!-- Шрифты из Варианта 1 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
    
    <!-- Библиотека для скачивания -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        body {
            background-color: #e5e5e5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Квадрат логотипа (Гамма из Варианта 3) */
        #logo-to-save {
            width: 600px;
            height: 600px;
            /* Цвета из Варианта 3 */
            background-color: #F0EBD5; /* Vanilla Cream */
            color: #A0817E; /* Dusty */
            
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.2s;
            position: relative;
        }

        #logo-to-save:hover {
            transform: scale(1.02);
        }

        /* Шрифты из Варианта 1 */
        .logo-main {
            font-family: 'Playfair Display', serif; /* Аналог Grosia */
            font-size: 4rem;
            font-weight: 500;
            letter-spacing: 0.05em;
            line-height: 1;
            margin-left: 0.05em;
        }

        .logo-sub {
            font-family: 'Montserrat', sans-serif; /* Аналог Gilroy */
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.6em;
            margin-top: 15px;
            text-transform: uppercase;
            margin-left: 0.6em; /* Выравнивание для разряда */
        }

        /* Подсказка */
        .hint {
            margin-top: 30px;
            color: #555;
            font-size: 1rem;
            text-align: center;
        }

        /* Адаптив для телефонов */
        @media (max-width: 650px) {
            #logo-to-save {
                width: 90vw;
                height: 90vw;
            }
            .logo-main { font-size: 3rem; }
            .logo-sub { font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- Блок логотипа -->
    <div id="logo-to-save" title="Нажмите, чтобы сохранить">
        <div class="logo-main">SHELA</div>
        <div class="logo-sub">Cosmetics</div>
    </div>

    <div class="hint">👆 Нажмите на логотип, чтобы скачать его в хорошем качестве</div>

    <script>
        document.getElementById('logo-to-save').addEventListener('click', function() {
            const logoElement = this;
            logoElement.style.cursor = 'wait';

            html2canvas(logoElement, {
                scale: 4, // Высокое разрешение (2400x2400)
                backgroundColor: null,
                useCORS: true 
            }).then(canvas => {
                const image = canvas.toDataURL("image/png", 1.0);
                const link = document.createElement('a');
                link.download = 'shela-logo-final.png';
                link.href = image;
                link.click();
                logoElement.style.cursor = 'pointer';
            }).catch(err => {
                console.error("Ошибка:", err);
                alert("Не удалось сохранить автоматически. Сделайте скриншот.");
                logoElement.style.cursor = 'pointer';
            });
        });
    </script>
</body>
</html>
